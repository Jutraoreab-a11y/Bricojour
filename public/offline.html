<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5C400">
<title>Hors connexion</title>
<style>
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #EEF0EC; color: #1D2733;
         font: 16px/1.5 system-ui, -apple-system, sans-serif; padding: 24px; box-sizing: border-box; }
  main { max-width: 22rem; }
  h1 { font-size: 2rem; line-height: 1.05; margin: 0 0 .5rem; font-weight: 800; }
  .tape { height: 18px; border-radius: 4px; margin-bottom: 1.5rem; background-color: #F5C400;
          background-image: repeating-linear-gradient(90deg, #1D2733 0 2px, transparent 2px 10px); background-size: 100% 9px; background-repeat: no-repeat; }
  button { margin-top: 1.25rem; width: 100%; min-height: 3.5rem; border: 0; border-radius: 14px; background: #1D2733; color: #fff; font-weight: 700; font-size: 1rem; }
</style>
</head>
<body>
<main>
  <div class="tape" aria-hidden="true"></div>
  <h1>Pas de connexion</h1>
  <p>Vos demandes et vos messages s’afficheront dès que le réseau revient.</p>
  <button onclick="location.reload()">Réessayer</button>
</main>
</body>
</html>
